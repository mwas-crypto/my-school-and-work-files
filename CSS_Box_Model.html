<!DOCTYPE html>
<html>
<head>
<title>CSS Box Model</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
}

.margin {
    background-color: lightblue;
    padding: 30px;
    width: 350px;
    margin: 30px auto;
}

.border {
    background-color: yellow;
    border: 5px solid black;
    padding: 20px;
}

.padding {
    background-color: lightgreen;
    padding: 20px;
}

.content {
    background-color: orange;
    padding: 25px;
}
</style>
</head>

<body>

<h2>CSS BOX MODEL</h2>

<div class="margin">
    MARGIN

    <div class="border">
        BORDER

        <div class="padding">
            PADDING

            <div class="content">
                CONTENT
            </div>

        </div>
    </div>
</div>

</body>
</html>
